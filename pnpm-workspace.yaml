# pnpm 11+ reads project config from here (not package.json#pnpm / most .npmrc keys).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  koffi: true

overrides:
  esbuild: '>=0.25.0'
  tinypool: '>=2.1.2'

engineStrict: true
shamefullyHoist: true

# pnpm 12 defaults to a release-age gate that breaks frozen CI installs when
# the lockfile already pins recently published transitive deps. Trust the lockfile.
minimumReleaseAge: 0

# Avoid re-running install before every script when modules are briefly locked (dev server).
verifyDepsBeforeRun: false
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
  picomatch@4.0.7: patches/picomatch@4.0.7.patch
  uri-js@4.4.1: patches/uri-js@4.4.1.patch
