name: Crowdin AI Pre-translate

# Tops up AI pre-translation in Crowdin, then pulls whatever is now translated.
#
# Crowdin's AI pre-translate spends roughly one Gemini request per batch of strings, and the AI
# Studio free tier meters requests per day *per model*: the full Flash tier gets ~20 requests/day
# each. scripts/crowdin-topup.mjs works around that by rotating models - when a pass adds
# nothing, it switches the Crowdin prompt to the next model, which has its own untouched
# allowance. Every entry in that rotation is a full Flash model; the Flash Lite tier has a much
# larger allowance but translates ICU plurals, {placeholders}, and glossary terms less reliably.
#
# One language at a time. A day's rotation is enough for one catalogue, so the schedule spends it
# on the next language that has not been shipped yet, and `ENABLED_LOCALES` in
# src/lib/i18n/types.ts stays in step: add the language here, then switch it on in the app once it
# is translated. Translating all targets at once splits the allowance and leaves every language
# half-done.
#
# It only ever pre-translates strings that are still untranslated, so it can be re-run freely
# and will never overwrite an existing or human-reviewed translation.
#
# Once the catalogue is fully translated this workflow becomes a cheap no-op that only spends
# quota on genuinely new strings. Setup: .github/workflows/SETUP.md

on:
  schedule:
    # 08:15 UTC is after midnight Pacific in both PDT (01:15) and PST (00:15), so the run
    # always lands on a freshly reset Google quota regardless of daylight saving.
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Comma-separated target languages (blank = zh-CN)'
        type: string
        default: ''
      download:
        description: 'Pull translations and open a PR afterwards'
        type: boolean
        default: true

# Shares crowdin-sync's concurrency group: both push to the same localisation branch, so
# letting them overlap would race on that branch.
concurrency:
  group: crowdin-sync
  cancel-in-progress: false

jobs:
  pre-translate:
    # Forks inherit the schedule/triggers but not the secrets, so every run there
    # fails and emails the fork owner. Only run in the upstream repository.
    if: github.repository_owner == 'Luen'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Top up AI pre-translation
        id: topup
        run: node scripts/crowdin-topup.mjs
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          # Simplified Chinese is the language being prepared. German, French, and Spanish have
          # shipped. Change this (and export_languages in crowdin.yml) when the next language
          # starts, and add it to ENABLED_LOCALES in src/lib/i18n/types.ts once it ships.
          CROWDIN_LANGUAGES: ${{ inputs.languages || 'zh-CN' }}

      - name: Pull translations and open a PR
        # Nothing new means nothing to download — skip rather than open an empty PR.
        # On schedule runs `inputs.download` is null, and `null != false` coerces both to 0 in
        # GitHub Actions expressions, so check `event_name` before reading `inputs.download`.
        if: steps.topup.outputs.added != '0' && (github.event_name != 'workflow_dispatch' || inputs.download)
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          upload_sources: false
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          # Same branch as crowdin-sync so both feed one translation PR rather than two.
          localization_branch_name: chore/crowdin-translations
          create_pull_request: true
          pull_request_base_branch_name: main
          pull_request_title: 'chore(i18n): sync translations from crowdin'
          pull_request_labels: 'i18n,automated'
          commit_message: 'chore(i18n): update translations from crowdin'
          pull_request_body: |
            ## Description

            Automated translation sync from Crowdin, following an AI pre-translate top-up.
            Pulls the latest target-language catalogues for `src/lib/i18n/locales/`.

            Generated by `.github/workflows/crowdin-pretranslate.yml` — **do not hand-edit
            these files**, Crowdin overwrites them on the next sync.

            ## Related Issues

            Refs #11

            ## Changes Made

            - Update target-language catalogues under `src/lib/i18n/locales/`

            ## Testing

            - [x] Not applicable — generated content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
