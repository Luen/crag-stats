name: Crowdin Sync

# Pushes the en source catalogue to Crowdin when it changes on main, and
# opens a pull request back with whatever translations exist.
#
# Setup (secrets, token scopes, repo permissions): .github/workflows/SETUP.md
on:
  push:
    branches: [main]
    # IMPORTANT: this path filter is what prevents a bot loop. The Crowdin PR only
    # ever touches src/lib/i18n/locales/<target>.json, never the source catalogue, so
    # merging a translation PR cannot re-trigger this workflow. Do not remove it.
    paths:
      - 'src/lib/i18n/locales/en.json'
      - 'crowdin.yml'
      - '.github/workflows/crowdin-sync.yml'
  workflow_dispatch:
    inputs:
      dryrun:
        description: 'Run without uploading or downloading anything'
        type: boolean
        default: true

concurrency:
  group: crowdin-sync
  cancel-in-progress: false

jobs:
  synchronise:
    # Forks inherit the schedule/triggers but not the secrets, so every run there
    # fails and emails the fork owner. Only run in the upstream repository.
    if: github.repository_owner == 'Luen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Push sources and pull translations
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          localization_branch_name: chore/crowdin-translations
          create_pull_request: true
          pull_request_base_branch_name: main
          pull_request_title: 'chore(i18n): sync translations from crowdin'
          pull_request_labels: 'i18n,automated'
          commit_message: 'chore(i18n): update translations from crowdin'
          dryrun_action: ${{ inputs.dryrun || false }}
          pull_request_body: |
            ## Description

            Automated translation sync from Crowdin. Pulls the latest target-language
            catalogues for `src/lib/i18n/locales/`.

            Generated by `.github/workflows/crowdin-sync.yml` — **do not hand-edit these
            files**, Crowdin overwrites them on the next sync.

            ## Related Issues

            Refs #11

            ## Changes Made

            - Update target-language catalogues under `src/lib/i18n/locales/`

            ## Testing

            - [x] Not applicable — generated content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
