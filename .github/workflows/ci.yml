name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR makes the older run obsolete. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, types and unit tests run beside the browser job so a failure in either reports sooner.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Install packageManager directly: Node 26 does not bundle Corepack.
      # The pnpm/action-setup self-installer
      # crashes when onlyBuiltDependencies is present as a non-array
      # (e.g. from .npmrc `only-built-dependencies=…`).
      - name: Install pinned pnpm
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          pnpm --version

      - name: Install build deps for better-sqlite3
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - run: pnpm install --frozen-lockfile
      - name: Lint (Prettier + ESLint)
        run: pnpm lint
      - run: pnpm check
      - name: Unit tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Same pinned pnpm setup as the check job.
      - name: Install pinned pnpm
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          pnpm --version

      - name: Install build deps for better-sqlite3
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: E2E tests (Playwright + axe)
        run: pnpm test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Exercise native dependencies and startup on both release architectures before publishing.
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: crag-stats:ci-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          cache-from: |
            type=gha,scope=docker-${{ matrix.arch }}
            type=gha
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      # impers fetches libcurl-impersonate via the unauthenticated GitHub API on first use; keep it
      # between runs so shared-runner rate limits rarely matter (#371). The cache dir is versioned.
      - name: Cache libcurl-impersonate
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/impers-cache
          key: impers-libcurl-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: impers-libcurl-${{ matrix.arch }}-
      - name: Native SQLite, migrations, HTTP and importer smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/impers-cache"
          docker run --rm --platform linux/${{ matrix.arch }} --entrypoint node \
            --mount type=bind,src="$PWD/scripts/container-smoke.mjs",dst=/app/scripts/container-smoke.mjs,readonly \
            --mount type=bind,src="$PWD/samples/thecrag-logbook-sample.csv",dst=/fixtures/logbook.csv,readonly \
            --mount type=bind,src="$RUNNER_TEMP/impers-cache",dst=/impers-cache \
            -e IMPER_CACHE_DIR=/impers-cache \
            -e CRAG_STATS_CONTAINER_SMOKE=1 \
            crag-stats:ci-${{ matrix.arch }} scripts/container-smoke.mjs --importer
