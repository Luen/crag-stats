name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Prefer corepack over pnpm/action-setup: the action self-installer
      # crashes when onlyBuiltDependencies is present as a non-array
      # (e.g. from .npmrc `only-built-dependencies=…`).
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install build deps for better-sqlite3
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - run: pnpm install --frozen-lockfile
      - name: Lint (Prettier + ESLint)
        run: pnpm lint
      - run: pnpm check
      - name: Unit tests
        run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests (Playwright + axe)
        run: pnpm test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Build the production image (amd64, no push) so Dockerfile / action changes are caught
  # on PRs, not only when a release tag runs docker-release.yml.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
