name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Prefer corepack over pnpm/action-setup: the action self-installer
      # crashes when onlyBuiltDependencies is present as a non-array
      # (e.g. from .npmrc `only-built-dependencies=…`).
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install build deps for better-sqlite3
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Unit tests
        run: pnpm test
      - run: pnpm build
