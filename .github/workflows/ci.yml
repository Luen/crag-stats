name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install build deps for better-sqlite3
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Unit tests
        run: pnpm test
      - run: pnpm build
