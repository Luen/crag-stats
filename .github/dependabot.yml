# Dependabot version updates: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # One PR for all minor/patch bumps instead of one per package.
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Types must track the Node runtime (24 LTS: CI, Docker, .nvmrc), not the latest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (native port) isn't supported by typescript-eslint / svelte-check yet.
      # Remove once they declare support for typescript@7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
