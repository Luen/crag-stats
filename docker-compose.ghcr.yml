# Homeserver deploy from public GHCR images
# Usage:
#   cp .env.example .env
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Pin a version with CRAG_STATS_IMAGE_TAG=v0.2.0
# Host publish port (separate from in-container PORT): HOST_PORT=8097
# Bind loopback only (Cloudflare Tunnel): HOST_BIND=127.0.0.1

services:
  app:
    image: ghcr.io/luen/crag-stats:${CRAG_STATS_IMAGE_TAG:-latest}
    container_name: crag-stats
    labels:
      # Watchtower --label-enable (safe if your watchtower uses it)
      com.centurylinklabs.watchtower.enable: 'true'
    ports:
      - '${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8097}:3000'
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/crag-stats.sqlite
      MIGRATIONS_DIR: /app/migrations
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - crag_data:/data
    restart: unless-stopped

  worker:
    image: ghcr.io/luen/crag-stats:${CRAG_STATS_IMAGE_TAG:-latest}
    container_name: crag-stats-worker
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    command: ['node', 'scripts/worker.mjs']
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/crag-stats.sqlite
      MIGRATIONS_DIR: /app/migrations
      APP_INTERNAL_URL: http://app:3000
    volumes:
      - crag_data:/data
    restart: unless-stopped
    depends_on:
      - app

volumes:
  crag_data:
